plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.devicecrypto'
version = '1.0.1'

android {
  namespace "expo.modules.devicecrypto"
  defaultConfig {
    versionCode 1
    versionName "1.0.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
